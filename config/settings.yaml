# YouTube Data API free quota is 10,000 units/day (resets midnight Pacific time).
daily_quota_limit: 10000
# Stop this many units before the limit so we never hit it by accident.
quota_safety_margin: 500

# Most recent N videos taken from each channel's uploads playlist.
max_videos_per_channel: 30

# NORMAL_KIDS_VIDEO keyword search (config/sources/normal_keywords.yaml): 100 units per keyword.
keyword_search:
  per_keyword: 30      # results kept per keyword (the search costs 100 units either way)
  target_total: 3000   # stop once the normal folder holds this many videos

# RANDOM_VIDEO: random word + random short publish-date window -> search.list (100 units each).
# A run tops the random folder up to `target`; it is resumable.
random:
  target: 250
  picks_per_search: 10      # random picks kept from each search's 50 results (more spread)
  max_searches: 80          # hard stop per run (80 searches = 8,000 units)
  window_start: "2026-01-01"  # earliest publish date that can be sampled
  window_days: 2            # width of each random publish window

# POPULAR_VIDEO: videos to take from each region's mostPopular chart (India gets more).
popular_regions:
  IN: 200
  US: 100
  GB: 100
  RU: 100
  CA: 100
